<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .section-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-top: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .pill-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .download-btn {
            width: 100%;
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .download-btn:hover {
            background: var(--accent-hover);
        }

        .settings-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .settings-content {
            display: none;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .settings-content.open {
            display: block;
        }

        .footer-note {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.4;
            margin-top: 10px;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Link to file</h1>
        <p class="subtitle">Paste a video link, pick a format, download.</p>

        <div class="section-label">Video link</div>
        <input type="text" id="videoUrl" placeholder="https://...">

        <div class="section-label">Video</div>
        <div class="pill-group" id="videoFormats">
            <button class="pill active" data-format="mp4">MP4</button>
            <button class="pill" data-format="webm">WEBM</button>
        </div>

        <div class="section-label">Audio</div>
        <div class="pill-group" id="audioFormats">
            <button class="pill" data-format="mp3">MP3</button>
            <button class="pill" data-format="m4a">M4A (Instagram voice)</button>
            <button class="pill" data-format="wav">WAV</button>
            <button class="pill" data-format="ogg">OGG</button>
            <button class="pill" data-format="flac">FLAC</button>
            <button class="pill" data-format="aac">AAC</button>
        </div>

        <p class="info-text">M4A (AAC) is the format phones use for voice messages, so it is the best pick for Instagram.</p>

        <div class="section-label">Quality</div>
        <select id="qualitySelect">
            <option value="best">Best available</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
        </select>

        <button class="download-btn" id="downloadBtn">Download</button>

        <button class="settings-toggle" id="toggleSettings">▼ Server settings</button>
        <div class="settings-content" id="settingsContent">
            <div class="section-label" style="margin-top: 0;">Backend address</div>
            <input type="text" id="backendAddress" placeholder="https://your-server.example.com">
        </div>

        <p class="footer-note">GitHub Pages only hosts this page. The converter runs on your own server (see server.py).</p>
    </div>

    <script>
        // Toggle settings menu
        const toggleBtn = document.getElementById('toggleSettings');
        const settingsContent = document.getElementById('settingsContent');
        toggleBtn.addEventListener('click', () => {
            settingsContent.classList.toggle('open');
            toggleBtn.textContent = settingsContent.classList.contains('open') ? '▲ Server settings' : '▼ Server settings';
        });

        // Format selection logic
        let selectedFormat = 'mp4';
        const allPills = document.querySelectorAll('.pill');
        allPills.forEach(pill => {
            pill.addEventListener('click', () => {
                allPills.forEach(p => p.classList.remove('active'));
                pill.classList.add('active');
                selectedFormat = pill.getAttribute('data-format');
            });
        });

        // Save and load backend address from localStorage
        const backendInput = document.getElementById('backendAddress');
        const savedBackend = localStorage.getItem('backend_address');
        if (savedBackend) {
            backendInput.value = savedBackend;
        }
        backendInput.addEventListener('input', () => {
            localStorage.setItem('backend_address', backendInput.value.trim());
        });

        // Download button click handler
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const url = document.getElementById('videoUrl').value.trim();
            const backend = backendInput.value.trim();

            if (!url) {
                alert('Please enter a video link!');
                return;
            }
            if (!backend) {
                alert('Please enter your backend address in Server settings!');
                return;
            }

            // Example integration request to backend server
            const targetApi = `${backend.replace(/\/$/, '')}/download?url=${encodeURIComponent(url)}&format=${selectedFormat}`;
            window.open(targetApi, '_blank');
        });
    </script>
</body>
</html>
