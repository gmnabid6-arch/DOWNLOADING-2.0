<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #1c1c1e;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }
        .section-title {
            font-size: 11px;
            letter-spacing: 1px;
            color: #8e8e93;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .option-btn {
            background: #2c2c2e;
            color: #e1e1e6;
            border: 1px solid #3a3a3c;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn.active {
            background: #5856d6;
            border-color: #5856d6;
            color: #fff;
        }
        select {
            width: 100%;
            padding: 12px;
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
            box-sizing: border-box;
            outline: none;
        }
        .download-btn {
            width: 100%;
            background: #5856d6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .download-btn:hover {
            background: #4846c2;
        }
        .server-box {
            margin-top: 20px;
            border-top: 1px solid #2c2c2e;
            padding-top: 15px;
        }
        .server-title {
            font-size: 12px;
            font-weight: bold;
            color: #8e8e93;
            margin-bottom: 8px;
        }
        #result {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        #result a {
            color: #0a84ff;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" id="urlInput" placeholder="Paste Video URL here...">
        
        <div class="section-title">VIDEO</div>
        <div class="btn-group" id="videoGroup">
            <button class="option-btn active" onclick="selectOption(this, 'videoGroup')">MP4</button>
            <button class="option-btn" onclick="selectOption(this, 'videoGroup')">WEBM</button>
        </div>

        <div class="section-title">AUDIO</div>
        <div class="btn-group" id="audioGroup">
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">MP3</button>
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">M4A (Instagram voice)</button>
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">WAV</button>
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">OGG</button>
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">FLAC</button>
            <button class="option-btn" onclick="selectOption(this, 'audioGroup')">AAC</button>
        </div>
        <p style="font-size: 11px; color: #8e8e93; margin-top: -4px; margin-bottom: 16px;">M4A (AAC) is the format phones use for voice messages, so it is the best pick for Instagram.</p>

        <div class="section-title">QUALITY</div>
        <select id="qualitySelect">
            <option>Best available</option>
        </select>

        <button class="download-btn" onclick="downloadVideo()">Download</button>
        
        <div class="server-box">
            <div class="server-title">▲ Server settings</div>
            <div class="section-title" style="margin-top: 8px;">BACKEND ADDRESS</div>
            <input type="text" id="backendUrl" value="https://downloading-2-0-2.onrender.com">
        </div>

        <div style="font-size: 10px; color: #8e8e93; text-align: center; margin-top: 10px;">
            GitHub Pages only hosts this page. The converter runs on your own server (see server.py).
        </div>

        <div id="result"></div>
    </div>

    <script>
        function selectOption(btn, groupId) {
            const group = document.querySelectorAll(`#${groupId} .option-btn`);
            group.forEach(b => b.classList.remove('active'));
            // If clicking already active, deselect or keep active. Let's make it exclusive per group.
            btn.classList.add('active');
            
            // If selecting video, clear audio selection and vice versa so only one format type is active
            if(groupId === 'videoGroup') {
                document.querySelectorAll('#audioGroup .option-btn').forEach(b => b.classList.remove('active'));
            } else {
                document.querySelectorAll('#videoGroup .option-btn').forEach(b => b.classList.remove('active'));
            }
        }

        async function downloadVideo() {
            const url = document.getElementById('urlInput').value;
            const backendUrl = document.getElementById('backendUrl').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                alert("Please enter a URL");
                return;
            }

            // Find active format button
            const activeBtn = document.querySelector('.option-btn.active');
            let formatType = activeBtn ? activeBtn.innerText.split(' ')[0] : 'MP4';

            resultDiv.innerText = "Processing...";

            try {
                const response = await fetch(`${backendUrl}/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, type: formatType })
                });
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `Success! <a href="${backendUrl}/files/${encodeURIComponent(data.filename)}" target="_blank">Download File</a>`;
                } else {
                    resultDiv.innerText = "Error: " + data.error;
                }
            } catch (err) {
                resultDiv.innerText = "Failed to connect to backend.";
            }
        }
    </script>
</body>
</html>
