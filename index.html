<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        input { width: 60%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Video Downloader</h2>
    <input type="text" id="urlInput" placeholder="Paste Video URL here...">
    <br><br>
    <button onclick="downloadVideo()">Download</button>
    <div id="result"></div>

    <script>
        // রেন্ডার থেকে পাওয়া আপনার ব্যাকএন্ড লাইভ লিংকটি এখানে বসাবেন (শেষে কোনো '/' থাকবে না)
        const BACKEND_URL = "https://your-backend-url.onrender.com";

        async function downloadVideo() {
            const url = document.getElementById('urlInput').value;
            const resultDiv = document.getElementById('result');
            if (!url) {
                alert("Please enter a URL");
                return;
            }
            resultDiv.innerText = "Processing...";

            try {
                const response = await fetch(`${BACKEND_URL}/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();
                if (data.success) {
                    resultDiv.innerHTML = `Success! <a href="${BACKEND_URL}/files/${encodeURIComponent(data.filename)}" target="_blank">Download File</a>`;
                } else {
                    resultDiv.innerText = "Error: " + data.error;
                }
            } catch (err) {
                resultDiv.innerText = "Failed to connect to backend.";
            }
        }
    </script>
</body>
</html>
