<html lang="en">

    <title>Video Downloader</title>

            margin: 0;

        }

            margin-bottom: 20px;

        }

            border: 1px solid #3a3a3c;

            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .option-btn.active {
            background: #5856d6;
            border-color: #5856d6;
            color: #fff;
        }

            box-sizing: border-box;
